[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lfg"
version = "0.2.1"
description = "Standalone reusable agentic software-development orchestration CLI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [{name = "LFG"}]
dependencies = [
  "langgraph>=1.0",
  "jsonschema>=4.22",
  "pydantic-ai>=1.0",
  "PyYAML>=6.0.1",
]

[project.scripts]
lfg = "lfg.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lfg"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
    select = ["E", "F", "I", "B", "UP", "SIM", "C4", "ARG", "PTH", "RUF"]
    ignore = ["B904", "E501", "SIM105"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/lfg", "tests"]

[[tool.mypy.overrides]]
module = ["yaml", "jsonschema"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "hatchling>=1.30.1",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "types-pyyaml>=6.0.12.20260518",
]
