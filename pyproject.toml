[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "railwarden"
version = "0.3.10"
description = "Deterministic execution and integration control plane for multi-agent software development"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [{name = "RailWarden maintainers"}]
maintainers = [{name = "RailWarden maintainers"}]
keywords = ["agents", "automation", "control-plane", "git", "multi-agent", "worktrees"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "langgraph>=1.0",
  "jsonschema>=4.22",
  "pydantic-ai>=1.0",
  "PyYAML>=6.0.1",
  "questionary>=2.1.0",
    "rich>=14.0.0",
]

[project.urls]
Homepage = "https://github.com/advaith-1212/railwarden"
Source = "https://github.com/advaith-1212/railwarden"
Issues = "https://github.com/advaith-1212/railwarden/issues"
Documentation = "https://github.com/advaith-1212/railwarden/tree/main/docs"

[project.scripts]
warden = "railwarden.cli.main:main"
lfg = "railwarden.cli.main:legacy_main"

[tool.hatch.build.targets.wheel]
packages = ["src/railwarden"]

[tool.hatch.build]
exclude = [
  "/.railwarden/**",
  "/.railwarden-runtime/**",
  "/.railwarden-worktrees/**",
  "/.railwarden-results/**",
  "/.lfg/**",
  "/.lfg-runtime/**",
  "/.lfg-worktrees/**",
  "/.lfg-results/**",
  "/.venv/**",
  "/.pytest_cache/**",
  "/.mypy_cache/**",
  "/.ruff_cache/**",
  "/artifacts/**",
  "/dist/**",
  "/work/**",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
    select = ["E", "F", "I", "B", "UP", "SIM", "C4", "ARG", "PTH", "RUF"]
    ignore = ["B904", "E501", "SIM105"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/railwarden", "tests"]

[[tool.mypy.overrides]]
module = ["yaml", "jsonschema"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "acceptance: deterministic, disposable-repository acceptance scenario",
]

[tool.coverage.run]
branch = true
source = ["railwarden"]

[tool.coverage.report]
show_missing = true
fail_under = 55

[dependency-groups]
dev = [
    "hatchling>=1.30.1",
    "build>=1.2.2",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.20",
    "types-pyyaml>=6.0.12.20260518",
]
