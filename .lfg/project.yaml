schema_version: 1.0.0
project:
  name: lfg
  repository_root: auto
  integration_branch: integration/lfg
  worktree_root: auto
  board: lfg-lfg
planning:
  provider: antigravity
  model: Claude Opus 4.6 (Thinking)
  approval_required: true
  allow_fallback: false
hermes:
  primary_model: Claude Opus 4.6 (Thinking)
  fallback_model: null
  allow_fallback: false
  board: lfg-lfg
  project_slug: lfg
  orchestrator_profile: null
  default_assignee: default
  profile_map: {}
  workspace_mode: worktree
providers:
  codex:
    priority: 10
    capabilities:
    - code
    - tests
    - review
    cooldown_seconds: 3600
  antigravity:
    priority: 20
    capabilities:
    - code
    - analysis
    - planning
    cooldown_seconds: 3600
  composer:
    priority: 30
    capabilities:
    - code
    - ui
    - repair
    cooldown_seconds: 3600
workers:
  concurrency: 3
  providers:
  - codex
  - antigravity
  - composer
execution:
  require_plan_approval: true
  preserve_partial_work_on_handoff: true
integration:
  serialized: true
  rollback_on_validation_failure: true
monitoring:
  git_graph: true
runtime:
  directory: .lfg-runtime
